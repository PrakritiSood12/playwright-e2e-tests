name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      RUNNER: ${{secrets.RUNNER}}
      TEST_USER_NAME: ${{secrets.TEST_USER_NAME}}
      TEST_PASSWORD: ${{secrets.TEST_PASSWORD}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npm run test:make-apt
      - name: Run Playwright tests
        run: npx playwright test
      - id: generate-allure
        name: Generate Allure report
        run: |
          npm install -g allure-commandline
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report
            echo "report-created=true" >> $GITHUB_OUTPUT
          else
            echo "No allure-results directory found, skipping Allure report generation"
            echo "report-created=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ steps.generate-allure.outputs.report-created == 'true' && !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ steps.generate-allure.outputs.report-created == 'true' && !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
